name: Deploy to CyberPanel VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto-generate Sitemap
        run: |
          node scripts/generate-sitemap.js
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Auto-update sitemap.xml [skip ci]"
            git push origin main || true
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan 72.61.224.90 >> ~/.ssh/known_hosts
          ssh-keyscan 2.24.194.230 >> ~/.ssh/known_hosts

      - name: Deploy to VPS (72.61.224.90)
        run: |
          git remote add vps ssh://root@72.61.224.90/home/pedgi.com/repo.git
          git push -f vps HEAD:main

      - name: Sync 72.61.224.90 and test 2.24.194.230
        run: |
          ssh root@72.61.224.90 "
            git --work-tree=/home/pedgi.com/public_html --git-dir=/home/pedgi.com/repo.git checkout -f main
            chown -R pedgi4477:nobody /home/pedgi.com/public_html
            /usr/local/lsws/bin/lswsctrl restart 2>/dev/null || true
            echo '=== Host info on 72.61.224.90 ==='
            hostname
            ip route get 1.1.1.1
            echo '=== SSH keys on 72.61.224.90 ==='
            ls -la /root/.ssh
            echo '=== Test SSH from 72.61.224.90 to 2.24.194.230 ==='
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@2.24.194.230 'hostname' 2>&1 || true
            echo '=== DNS resolution for pedgi.com from 72.61.224.90 ==='
            host pedgi.com || getent hosts pedgi.com || true
          "

