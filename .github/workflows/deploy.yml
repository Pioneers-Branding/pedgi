name: Deploy to CyberPanel VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto-generate Sitemap
        run: |
          node scripts/generate-sitemap.js
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Auto-update sitemap.xml [skip ci]"
            git push origin main || true
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan 72.61.224.90 >> ~/.ssh/known_hosts
          ssh-keyscan 2.24.194.230 >> ~/.ssh/known_hosts

      - name: Deploy to VPS (72.61.224.90)
        run: |
          git remote add vps ssh://root@72.61.224.90/home/pedgi.com/repo.git
          git push -f vps HEAD:main

      - name: Sync 72.61.224.90 and test 2.24.194.230
        run: |
          ssh root@72.61.224.90 "
            echo '=== Grep pedgi in bash_history ==='
            grep -i 'pedgi' /root/.bash_history 2>/dev/null || true
            echo '=== Grep 2.24 in bash_history ==='
            grep -i '2.24' /root/.bash_history 2>/dev/null || true
            echo '=== Grep rsync in bash_history ==='
            grep -i 'rsync' /root/.bash_history 2>/dev/null || true
            echo '=== Grep scp in bash_history ==='
            grep -i 'scp' /root/.bash_history 2>/dev/null || true
          "





