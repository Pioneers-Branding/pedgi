name: Deploy to CyberPanel VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto-generate Sitemap
        run: |
          node scripts/generate-sitemap.js
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Auto-update sitemap.xml [skip ci]"
            git push origin main || true
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan 72.61.224.90 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          git remote add vps ssh://root@72.61.224.90/home/pedgi.com/repo.git
          git push -f vps HEAD:main

      - name: Sync to public_html and purge cache
        run: |
          ssh root@72.61.224.90 "
            echo '=== Checking post-receive hook ==='
            cat /home/pedgi.com/repo.git/hooks/post-receive 2>/dev/null || echo 'No post-receive hook'
            echo '=== Checking out main to public_html ==='
            git --work-tree=/home/pedgi.com/public_html --git-dir=/home/pedgi.com/repo.git checkout -f main
            echo '=== Sitemap loc sample ==='
            head -n 25 /home/pedgi.com/public_html/sitemap.xml
            echo '=== Robots.txt ==='
            cat /home/pedgi.com/public_html/robots.txt
            echo '=== Restarting LiteSpeed ==='
            /usr/local/lsws/bin/lswsctrl restart 2>/dev/null || systemctl restart lsws 2>/dev/null || true
          "
