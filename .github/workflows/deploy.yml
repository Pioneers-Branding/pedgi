name: Deploy to CyberPanel VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto-generate Sitemap
        run: |
          node scripts/generate-sitemap.js
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Auto-update sitemap.xml [skip ci]"
            git push origin main || true
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan 72.61.224.90 >> ~/.ssh/known_hosts
          ssh-keyscan 2.24.194.230 >> ~/.ssh/known_hosts

      - name: Deploy to VPS (72.61.224.90)
        run: |
          git remote add vps ssh://root@72.61.224.90/home/pedgi.com/repo.git
          git push -f vps HEAD:main

      - name: Sync 72.61.224.90 and test 2.24.194.230
        run: |
          ssh root@72.61.224.90 "
            git --work-tree=/home/pedgi.com/public_html --git-dir=/home/pedgi.com/repo.git checkout -f main
            chown -R pedgi4477:nobody /home/pedgi.com/public_html
            /usr/local/lsws/bin/lswsctrl restart 2>/dev/null || true
          "
          echo "=== Testing SSH to 2.24.194.230 ==="
          ssh -o BatchMode=yes root@2.24.194.230 "
            echo '=== Successfully connected to 2.24.194.230! ==='
            ls -la /home/pedgi.com
            if [ -d /home/pedgi.com/repo.git ]; then
              echo 'Found repo.git on 2.24.194.230'
            fi
          " || echo "Direct SSH to 2.24.194.230 with VPS_SSH_KEY failed."

